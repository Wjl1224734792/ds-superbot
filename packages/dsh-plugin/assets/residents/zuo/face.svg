<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="作 正式头像" class="stwd-resident-svg stwd-resident-svg--zuo">
  <title>作（正式原创脸谱）</title>
  <defs>
    <linearGradient id="stwd-zuo-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f7ee"/>
