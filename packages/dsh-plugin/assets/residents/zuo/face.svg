    </linearGradient>
    <radialGradient id="stwd-zuo-skin" cx="0.45" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#edd0ae"/>
      <stop offset="1" stop-color="#d2ae86"/>
    </radialGradient>
    <linearGradient id="stwd-zuo-hair" x1="0.2" y1="0" x2="0.8" y2="1">
